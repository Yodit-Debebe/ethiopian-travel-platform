services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ethiotravel
      POSTGRES_USER: ethiotravel
      POSTGRES_PASSWORD: ethiotravel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethiotravel -d ethiotravel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret-key-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: ethiotravel
      DB_USER: ethiotravel
      DB_PASSWORD: ethiotravel
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media:
