{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - EthioTrav</title>
    <link rel="stylesheet" href="{% static 'assets/styles.css' %}">
</head>

<body>


<header class="navbar">
    <div class="logo">EthioTrav</div>
    <nav>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="{% url 'register' %}">Register</a></li>
        </ul>
    </nav>
    <div class="call-info">call us: 00 21 43 234</div>
</header>

<main class="container">
    <h1 class="page-title">Complete Your Payment</h1>
    <div class="card">

        <h2>{{ destination.name }}</h2>
        <p>Price: <span class="price">${{ destination.price }}</span></p>

        <form method="POST" style="margin-top:20px;">
            {% csrf_token %}

            <label style="font-weight: 600;">Full Name</label>
            <input 
                type="text" 
                name="full_name" 
                required
                placeholder="Enter your full name"
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:6px;">

            <label style="font-weight: 600;">Email</label>
            <input 
                type="email" 
                name="email" 
                required
                placeholder="Enter your email"
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:6px;">

            <label style="font-weight: 600;">Payment Method</label>
            <select 
                name="method" 
                required
                style="width:100%; padding:10px; margin:8px 0 20px 0; border:1px solid #ccc; border-radius:6px;">
                <option value="">Choose Method</option>
                <option value="telebirr">Telebirr</option>
                <option value="cbe_birr">CBE Birr</option>
            </select>

            <button 
                type="submit"
                style="padding:10px 25px; background:#555; color:white; border:none; border-radius:6px; cursor:pointer;">
                Pay Now
            </button>
        </form>
    </div>
</main>
</body>
</html>
